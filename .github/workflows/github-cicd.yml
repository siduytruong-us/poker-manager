name: PokerHost CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Choose deployment target'
        required: true
        default: 'app_tester'
        type: choice
        options:
          - app_tester
          - google_play

jobs:
  # Stage 1: Run Test Cases
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: |
          echo "Executing test cases..."
          ./gradlew test || true

  # Stage 2 (Concurrent A): Publish to Firebase App Tester (Android)
  publish-android-to-tester:
    name: Build & Publish Android
    needs: [ test ]
    runs-on: ubuntu-latest
    environment: manual-release
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > release.jks

      - name: Log Version Info
        run: |
          VERSION_NAME=$(grep "versionName =" composeApp/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          echo -e "\e[32m##################################################\e[0m"
          echo -e "\e[32mUPDATING VERSION CODE: ${{ github.run_number }}\e[0m"
          echo -e "\e[32mUPDATING VERSION NAME: $VERSION_NAME\e[0m"
          echo -e "\e[32m##################################################\e[0m"

      - name: Build and Upload to Firebase App Distribution
        run: ./gradlew :composeApp:assembleRelease :composeApp:appDistributionUploadRelease -PVERSION_CODE=${{ github.run_number }} -PSIGNING_STORE_FILE=release.jks
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

  # Stage 2 (Concurrent B): Deploy to Firebase Hosting (Web)
  deploy-web:
    name: Build & Deploy Web
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Web Distribution (Wasm)
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKER_HOST_550CA }}'
          channelId: live
          projectId: poker-host-550ca

  # Stage 3: Publish to Play Store (After Android Success)
  publish-to-play-store:
    name: Publish to Google Play Store
    needs: [ publish-android-to-tester ]
    runs-on: ubuntu-latest
    environment: google-play-release
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > release.jks

      - name: Log Version Info
        run: |
          VERSION_NAME=$(grep "versionName =" composeApp/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          echo -e "\e[32m##################################################\e[0m"
          echo -e "\e[32mPUBLISHING TO GOOGLE PLAY INTERNAL TESTING\e[0m"
          echo -e "\e[32mVERSION CODE: ${{ github.run_number }}\e[0m"
          echo -e "\e[32mVERSION NAME: $VERSION_NAME\e[0m"
          echo -e "\e[32m##################################################\e[0m"

      - name: Build Release Bundle (AAB)
        run: ./gradlew :composeApp:bundleRelease -PVERSION_CODE=${{ github.run_number }} -PSIGNING_STORE_FILE=release.jks
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonKey: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.duyts.pokerhost
          releaseFiles: composeApp/build/outputs/bundle/release/*.aab
          track: internal
